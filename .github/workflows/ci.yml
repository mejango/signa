name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ANVIL_BINARY: anvil
      FORGE_BINARY: forge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Install pinned Forge and Anvil
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.0
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm --prefix mcp ci --ignore-scripts
      - name: Install pinned Chromium for WebAuthn producer checks
        run: npx playwright install --with-deps --only-shell chromium
      - name: Prepare verified local V6 payment fixture
        run: |
          fixture="$RUNNER_TEMP/center-v6-payment"
          node scripts/rest/prepare-v6-payment-fixture.mjs --output "$fixture"
          echo "CENTER_V6_SOURCE_ROOT=$fixture" >> "$GITHUB_ENV"
      - name: Verify artifacts, run Foundry and Anvil tests, and check application
        run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix mcp audit --omit=dev --audit-level=high
      - run: docker build --build-arg SIGNA_BUILD_COMMIT=${{ github.sha }} -t signa:${{ github.sha }} .
